name: docs

# Builds the API reference on every push to main and pull request. Run by hand
# from the Actions tab, or by the release workflow, with a version tag, e.g.
# v1.0.0, it builds the API reference of that tag and publishes it.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v1.0.0)"
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: "Tag to publish (e.g. v1.0.0)"
        required: true
        type: string

# Publishing a tag doesn't cancel, and isn't canceled by, builds of the same
# branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: true

jobs:
  build:
    name: Build API reference
    runs-on: ubuntu-24.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            cmake doxygen libcurl4-openssl-dev ninja-build nlohmann-json3-dev

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}

      # Fails on Doxygen warnings, e.g. broken references.
      - name: Build
        run: |
          cmake -S . -B build -G Ninja \
            -DPIPECAT_BUILD_DOCS=ON \
            -DPIPECAT_BUILD_TESTS=OFF \
            -DPIPECAT_WARNINGS_AS_ERRORS=ON
          cmake --build build --target docs

      - uses: actions/upload-pages-artifact@v5
        if: inputs.tag
        with:
          path: build/docs/html

  # Publishes the API reference to GitHub Pages, served at docs-cxx.pipecat.ai.
  # The custom domain is set in the repository's Pages settings, since Pages
  # ignores CNAME files when deploying from Actions.
  deploy:
    name: Publish API reference
    if: inputs.tag
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
