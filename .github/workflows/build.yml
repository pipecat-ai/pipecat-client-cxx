name: build

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unix:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64 (GCC)
            os: ubuntu-24.04
            cxx: g++
          - name: Linux x86_64 (Clang)
            os: ubuntu-24.04
            cxx: clang++
            packages: clang
          - name: Linux aarch64 (GCC)
            os: ubuntu-24.04-arm
            cxx: g++
          # Oldest supported toolchain: GCC 9, CMake 3.16, nlohmann_json 3.7.
          - name: Linux x86_64 (GCC 9, Ubuntu 20.04)
            os: ubuntu-24.04
            container: ubuntu:20.04
            cxx: g++
          - name: macOS aarch64 (Apple Clang)
            os: macos-latest
            cxx: clang++
    steps:
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update
          $SUDO env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates cmake g++ git make meson ninja-build pkg-config \
            libcurl4-openssl-dev nlohmann-json3-dev ${{ matrix.packages }}

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install meson nlohmann-json ninja pkgconf

      - uses: actions/checkout@v5

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DPIPECAT_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        working-directory: build
        run: ctest --output-on-failure

      - name: Install
        run: cmake --install build --prefix "$PWD/install"

      - name: Build against installed package (CMake)
        run: |
          cmake -S tests/package -B build-package -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_PREFIX_PATH="$PWD/install"
          cmake --build build-package
          ./build-package/package_test

      - name: Build against installed package (Meson)
        run: |
          export PKG_CONFIG_PATH="$PWD/install/lib/pkgconfig"
          CXX=${{ matrix.cxx }} meson setup build-meson tests/package
          ninja -C build-meson
          ./build-meson/package_test

  tsan:
    name: Linux x86_64 (Clang, ThreadSanitizer)
    runs-on: ubuntu-24.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            clang cmake ninja-build libcurl4-openssl-dev nlohmann-json3-dev

      # ThreadSanitizer in Clang 18 fails to start with the runner's default
      # address space randomization.
      - name: Reduce address space randomization
        run: sudo sysctl vm.mmap_rnd_bits=28

      - uses: actions/checkout@v5

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_COMPILER=clang++
          "-DCMAKE_CXX_FLAGS=-fsanitize=thread -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=thread
          -DPIPECAT_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build

      # Run the tests several times, since races don't show up every time.
      - name: Test
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: ./build/tests/pipecat_tests --gtest_repeat=5 --gtest_brief=1

  windows:
    name: Windows x86_64 (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          cmake --preset vcpkg -DPIPECAT_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
