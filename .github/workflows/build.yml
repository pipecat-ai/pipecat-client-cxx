name: build

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DAILY_CORE_VERSION: 0.23.0

jobs:
  unix:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64 (GCC)
            os: ubuntu-24.04
            cxx: g++
            transports: true
            daily_core: linux-x86_64
          - name: Linux x86_64 (Clang)
            os: ubuntu-24.04
            cxx: clang++
            transports: true
            daily_core: linux-x86_64
            packages: clang
          - name: Linux aarch64 (GCC)
            os: ubuntu-24.04-arm
            cxx: g++
            transports: true
            daily_core: linux-arm64
          # Oldest supported toolchain: GCC 9, CMake 3.16, nlohmann_json 3.7.
          # Also checks that the client builds without any transport.
          - name: Linux x86_64 (GCC 9, Ubuntu 20.04)
            os: ubuntu-24.04
            container: ubuntu:20.04
            cxx: g++
          - name: macOS aarch64 (Apple Clang)
            os: macos-latest
            cxx: clang++
            transports: true
            daily_core: macos-arm64
    steps:
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update
          $SUDO env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates cmake g++ git make meson ninja-build pkg-config \
            libcurl4-openssl-dev libopus-dev libspeexdsp-dev libssl-dev \
            nlohmann-json3-dev portaudio19-dev unzip ${{ matrix.packages }}

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install meson nlohmann-json ninja openssl@3 opus pkgconf portaudio speexdsp
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      - name: Download Daily Core
        if: matrix.transports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sdk=daily-core-sdk-$DAILY_CORE_VERSION-${{ matrix.daily_core }}
          gh release download "v$DAILY_CORE_VERSION" --repo daily-co/daily-core-sdk --pattern "$sdk.zip"
          unzip -q "$sdk.zip"
          echo "DailyCore_ROOT=$PWD/$sdk" >> "$GITHUB_ENV"

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DPIPECAT_WARNINGS_AS_ERRORS=ON
          -DPIPECAT_BUILD_DAILY=${{ matrix.transports && 'ON' || 'OFF' }}
          -DPIPECAT_BUILD_SMALLWEBRTC=${{ matrix.transports && 'ON' || 'OFF' }}
          -DPIPECAT_BUILD_WEBSOCKET=${{ matrix.transports && 'ON' || 'OFF' }}

      - name: Build
        run: cmake --build build

      - name: Test
        working-directory: build
        run: ctest --output-on-failure

      - name: Install
        run: cmake --install build --prefix "$PWD/install"

      - name: Build against installed package (CMake)
        run: |
          cmake -S tests/package -B build-package -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_PREFIX_PATH="$PWD/install"
          cmake --build build-package
          ./build-package/package_test

      - name: Build against installed package (Meson)
        run: |
          export PKG_CONFIG_PATH="$PWD/install/lib/pkgconfig"
          CXX=${{ matrix.cxx }} meson setup build-meson tests/package
          ninja -C build-meson
          ./build-meson/package_test

      - name: Build against installed package (CMake, Daily)
        if: matrix.transports
        run: |
          cmake -S transports/daily/tests/package -B build-package-daily -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_PREFIX_PATH="$PWD/install"
          cmake --build build-package-daily
          ./build-package-daily/package_test

      - name: Build against installed package (CMake, SmallWebRTC)
        if: matrix.transports
        run: |
          cmake -S transports/smallwebrtc/tests/package -B build-package-smallwebrtc -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_PREFIX_PATH="$PWD/install"
          cmake --build build-package-smallwebrtc
          ./build-package-smallwebrtc/package_test

      - name: Build against installed package (CMake, WebSocket)
        if: matrix.transports
        run: |
          cmake -S transports/websocket/tests/package -B build-package-websocket -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_PREFIX_PATH="$PWD/install"
          cmake --build build-package-websocket
          ./build-package-websocket/package_test

      - name: Build the examples
        if: matrix.transports
        run: |
          for example in text voice; do
            cmake -S "examples/$example" -B "build-$example" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
              -DCMAKE_PREFIX_PATH="$PWD/install"
            cmake --build "build-$example"
          done

  tsan:
    name: Linux x86_64 (Clang, ThreadSanitizer)
    runs-on: ubuntu-24.04
    steps:
      # Without speexdsp and libopus, so the build downloads them, which the
      # other jobs don't.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            clang cmake ninja-build libcurl4-openssl-dev libssl-dev nlohmann-json3-dev

      # ThreadSanitizer in Clang 18 fails to start with the runner's default
      # address space randomization.
      - name: Reduce address space randomization
        run: sudo sysctl vm.mmap_rnd_bits=28

      - uses: actions/checkout@v7

      # The downloaded libdatachannel and its C dependencies are instrumented
      # too.
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++
          "-DCMAKE_C_FLAGS=-fsanitize=thread -fno-omit-frame-pointer"
          "-DCMAKE_CXX_FLAGS=-fsanitize=thread -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=thread
          -DPIPECAT_WARNINGS_AS_ERRORS=ON
          -DPIPECAT_BUILD_SMALLWEBRTC=ON
          -DPIPECAT_BUILD_WEBSOCKET=ON

      - name: Build
        run: cmake --build build

      # Run the tests several times, since races don't show up every time.
      - name: Test
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: ./build/tests/pipecat_tests --gtest_repeat=5 --gtest_brief=1

      - name: Test (SmallWebRTC)
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: ./build/transports/smallwebrtc/tests/pipecat_smallwebrtc_tests --gtest_repeat=5 --gtest_brief=1

      - name: Test (WebSocket)
        env:
          TSAN_OPTIONS: halt_on_error=1 suppressions=${{ github.workspace }}/transports/websocket/tests/tsan.supp
        run: ./build/transports/websocket/tests/pipecat_websocket_tests --gtest_repeat=5 --gtest_brief=1

  windows:
    name: Windows x86_64 (MSVC)
    runs-on: windows-latest
    env:
      # Where vcpkg keeps the packages it builds, cached between runs.
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\vcpkg-cache,readwrite
    steps:
      - uses: actions/checkout@v7

      - name: Find the vcpkg version
        run: |
          New-Item -ItemType Directory -Force vcpkg-cache | Out-Null
          "VCPKG_COMMIT=$(git -C $env:VCPKG_INSTALLATION_ROOT rev-parse HEAD)" | Out-File -FilePath $env:GITHUB_ENV -Append

      # A new cache is saved when the manifest or vcpkg change. It starts from
      # the last one, and vcpkg only builds the packages that changed.
      - name: Cache vcpkg packages
        uses: actions/cache@v6
        with:
          path: vcpkg-cache
          key: vcpkg-windows-${{ hashFiles('vcpkg.json') }}-${{ env.VCPKG_COMMIT }}
          restore-keys: vcpkg-windows-

      - name: Download Daily Core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sdk = "daily-core-sdk-$env:DAILY_CORE_VERSION-windows-x86_64"
          gh release download "v$env:DAILY_CORE_VERSION" --repo daily-co/daily-core-sdk --pattern "$sdk.zip"
          Expand-Archive "$sdk.zip" -DestinationPath .
          "DailyCore_ROOT=$pwd/$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          cmake --preset vcpkg -DPIPECAT_WARNINGS_AS_ERRORS=ON -DPIPECAT_BUILD_DAILY=ON `
            -DPIPECAT_BUILD_SMALLWEBRTC=ON -DPIPECAT_BUILD_WEBSOCKET=ON `
            "-DVCPKG_MANIFEST_FEATURES=smallwebrtc;websocket"

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
