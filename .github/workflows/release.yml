name: release

# Creates the GitHub Release for a version tag, e.g. v1.0.0, when run by hand
# from the Actions tab with that tag, which must already be pushed. Its notes
# are the version's section of CHANGELOG.md, reformatted for GitHub by
# scripts/release-changelog.py, and it comes with a source tarball whose
# checksum never changes, for FetchContent. A tag that doesn't exist, that
# doesn't match the version in CMakeLists.txt, or whose version has no
# changelog section, fails. Then the docs workflow publishes the tag's API
# reference.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0)"
        required: true
        type: string

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Check the tag format
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$TAG isn't a version tag like v1.0.0"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Check the version
        run: |
          version=$(sed -n 's/^project(pipecat VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::$TAG doesn't match version $version in CMakeLists.txt"
            exit 1
          fi

      - name: Write the release notes
        run: python3 scripts/release-changelog.py --no-heading "${TAG#v}" > release-notes.md

      - name: Make the source tarball
        run: |
          name="pipecat-client-cxx-${TAG#v}"
          git archive --format=tar.gz --prefix="$name/" -o "$name.tar.gz" HEAD
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"

      # Running it again only updates the notes, so the tarball's checksum
      # never changes.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="pipecat-client-cxx-${TAG#v}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" "$name.tar.gz" "$name.tar.gz.sha256" \
              --verify-tag --title "$TAG" --notes-file release-notes.md
          fi

  docs:
    name: API reference
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
    with:
      tag: ${{ inputs.tag }}
